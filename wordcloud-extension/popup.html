<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 450px;
      height: auto;
      min-height: 400px;
      margin: 0;
      padding: 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }
    h3 { margin: 0; font-size: 18px; }
    .meta-info {
      font-size: 14px;
      color: #555;
      font-weight: bold;
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
      gap: 10px;
    }
    .tab-btn {
      padding: 5px 15px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
    .content-section {
      display: none;
    }
    .content-section.active {
      display: block;
    }
    #wordcloud-container {
      width: 100%;
      height: 300px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      overflow: hidden;
      gap: 4px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 5px;
      box-sizing: border-box;
    }
    #summary-container {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 15px;
      box-sizing: border-box;
    }
    .summary-sentence {
      margin-bottom: 12px;
      line-height: 1.5;
      font-size: 14px;
    }
    .word {
      display: block;
      margin: 2px;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .word:hover {
      transform: scale(1.1);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    #loading {
      margin-top: 100px;
      font-size: 16px;
      color: #666;
    }
    .action-bar {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }
    #zen-btn {
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    #zen-btn:hover { background: #555; }
  </style>
</head>
<body>
  <div class="header">
    <h3>Super Charged TLDR</h3>
    <div class="meta-info" id="reading-time">Reading: -- min</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-target="cloud-view">Word Cloud</button>
    <button class="tab-btn" data-target="summary-view">Summary</button>
  </div>

  <div id="loading">Analyzing text...</div>

  <div id="cloud-view" class="content-section active">
    <div id="wordcloud-container"></div>
  </div>

  <div id="summary-view" class="content-section">
    <div id="summary-container"></div>
  </div>

  <div class="action-bar">
    <button id="zen-btn">Toggle Zen Mode</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
